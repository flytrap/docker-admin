############################################################
## 1. 创建并启动容器:
##       docker-compose -f postgresql.yml up -d

# docker run --name postgresql -e POSTGRES_PASSWORD=123456 -e POSTGRES_USER=postgres -v /Users/flytrap/data/database/postgresql:/var/lib/postgresql --restart always -d -p 5432:5432 postgres
###########################################################
services:
  postgresql:
    image: pgvector/pgvector:pg17
    container_name: postgresql
    restart: always
    networks:
      - flytrap
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-123456} # 优先从环境变量读取
      - POSTGRES_DB=claw
    volumes:
      - ./data:/var/lib/postgresql/data:rw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  flytrap:
    external: true
